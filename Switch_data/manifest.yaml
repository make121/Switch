format_version: 1
robot: g1_23dof
fps: 30

skills:
  - id: cmu_141_12
    source: skills/source/141_12_poses.npz
    retargeted: skills/retargeted/141_12_poses_retarget.pkl
  - id: cmu_141_14
    source: skills/source/141_14_poses.npz
    retargeted: skills/retargeted/141_14_poses_retarget.pkl
  - id: cmu_141_19
    source: skills/source/141_19_poses.npz
    retargeted: skills/retargeted/141_19_poses_retarget.pkl

recovery:
  variant: bilateral_hip_orientation_07
  entries:
    - id: cmu_140_01
      source: recovery/source/140_01_poses.npz
      retargeted: recovery/retargeted/140_01_poses_retarget.pkl
      contact_refined: recovery/retargeted_contact_refined/140_01_poses_retarget.pkl
    - id: cmu_140_02
      source: recovery/source/140_02_poses.npz
      retargeted: recovery/retargeted/140_02_poses_retarget.pkl
      contact_refined: recovery/retargeted_contact_refined/140_02_poses_retarget.pkl
    - id: cmu_140_04
      source: recovery/source/140_04_poses.npz
      retargeted: recovery/retargeted/140_04_poses_retarget.pkl
      contact_refined: recovery/retargeted_contact_refined/140_04_poses_retarget.pkl
    - id: cmu_140_08
      source: recovery/source/140_08_poses.npz
      retargeted: recovery/retargeted/140_08_poses_retarget.pkl
      contact_refined: recovery/retargeted_contact_refined/140_08_poses_retarget.pkl
    - id: cmu_140_09
      source: recovery/source/140_09_poses.npz
      retargeted: recovery/retargeted/140_09_poses_retarget.pkl
      contact_refined: recovery/retargeted_contact_refined/140_09_poses_retarget.pkl

skill_graph:
  scope: skills_only
  builder: ../SG_build/build_sg.py
  inputs:
    - skills/retargeted/141_12_poses_retarget.pkl
    - skills/retargeted/141_14_poses_retarget.pkl
    - skills/retargeted/141_19_poses_retarget.pkl
  labels:
    - cmu_141_12
    - cmu_141_14
    - cmu_141_19
  parameters:
    threshold: 30.0
    topk: 5
    buffer_base: 1.0
    max_buffer: 30
    subsample: 3
    exclude_boundary: 10
    transition_selection: phase
    phase_bins: 16
    edges_per_bin: 1
    edge_alignment: se2_xy_yaw
  artifacts:
    graph: skill_graph/skill_graph.json
    transitions: skill_graph/augmented_motions.pkl
    training_data: skill_graph/merged_training.pkl
    scheduler_candidates: skill_graph/scheduler_config.yaml
  summary:
    original_nodes: 1170
    buffer_nodes: 1438
    temporal_edges: 1167
    cross_skill_macro_edges: 96
    buffer_chain_edges: 1534
    transition_trajectories: 96

unified_graph:
  scope: task_and_recovery_directed
  builder: ../SG_build/build_sg.py
  roles:
    task:
      - cmu_141_12
      - cmu_141_14
      - cmu_141_19
    recovery:
      - cmu_140_01
      - cmu_140_02
      - cmu_140_04
      - cmu_140_08
      - cmu_140_09
  allowed_cross_role_edges:
    - task_to_task
    - recovery_to_task
  forbidden_cross_role_edges:
    - task_to_recovery
    - recovery_to_recovery
  parameters:
    threshold: 30.0
    topk: 5
    buffer_base: 1.0
    max_buffer: 30
    subsample: 3
    exclude_boundary: 10
    transition_selection: phase
    phase_bins: 16
    edges_per_bin: 1
    recovery_exit_fraction: 0.2
    task_entry_fraction: 0.2
    recovery_edges_per_task: 3
  sampling_ratios:
    task_skill: 0.40
    recovery_skill: 0.35
    task_transition: 0.15
    recovery_transition: 0.10
  artifacts:
    graph: unified_graph/skill_graph.json
    transitions: unified_graph/augmented_motions.pkl
    training_data: unified_graph/merged_training.pkl
  summary:
    original_nodes: 2318
    buffer_nodes: 1930
    temporal_edges: 2310
    task_to_task_macro_edges: 96
    recovery_to_task_macro_edges: 45
    transition_trajectories: 141

unified_graph_contact_refined:
  status: current
  source: unified_graph
  recovery_variant: recovery/retargeted_contact_refined
  checksum_file: CHECKSUMS.sha256
  artifacts:
    graph: unified_graph_contact_refined/skill_graph.json
    transitions: unified_graph_contact_refined/augmented_motions.pkl
    training_data: unified_graph_contact_refined/merged_training.pkl
  summary:
    original_nodes: 2313
    buffer_nodes: 1995
    temporal_edges: 2305
    task_to_task_macro_edges: 96
    recovery_to_task_macro_edges: 45
    transition_trajectories: 141
